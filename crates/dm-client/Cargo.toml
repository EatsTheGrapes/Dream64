[package]
name = "dm-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
dm-compiler = { path = "../dm-compiler" }
dm-dmf = { path = "../dm-dmf" }
dm-lifecycle = { path = "../dm-lifecycle" }
dm-map = { path = "../dm-map" }
dm-project = { path = "../dm-project" }
dm-runtime = { path = "../dm-runtime" }
dm-value = { path = "../dm-value" }
dm-vm = { path = "../dm-vm" }
dm-world = { path = "../dm-world" }
flate2 = "1.1"
font8x8 = "0.3"
bytemuck = { version = "1.23", features = ["derive"] }
png = "0.17"
pollster = "0.4"
softbuffer = "0.4.8"
serde_json = "1"
wgpu = { version = "26.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "gles", "vulkan", "wgsl"] }
winit = "0.30.13"

[target.'cfg(windows)'.dependencies]
wry = "0.53"

[lints]
workspace = true
