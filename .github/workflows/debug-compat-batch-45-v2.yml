name: Capture second compatibility batch failure

on:
  push:
    branches: [main]
    paths: [.github/workflows/debug-compat-batch-45-v2.yml]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compat-batch-45
          fetch-depth: 0
      - name: Run and capture
        shell: bash
        run: |
          set +e
          LOG=/tmp/compat45v2.log
          echo '=== PATCH ===' > "$LOG"
          python3 tools/compat_batch_45.py >> "$LOG" 2>&1
          STATUS=$?
          if [ $STATUS -eq 0 ]; then python3 tools/compat_batch_45_followup.py >> "$LOG" 2>&1; STATUS=$?; fi
          if [ $STATUS -eq 0 ]; then echo '=== FMT ===' >> "$LOG"; cargo fmt --all >> "$LOG" 2>&1; STATUS=$?; fi
          if [ $STATUS -eq 0 ]; then echo '=== FOCUSED TESTS ===' >> "$LOG"; cargo test -p dm-project -p dm-semantics -p dm-runtime >> "$LOG" 2>&1; STATUS=$?; fi
          if [ $STATUS -eq 0 ]; then echo '=== WORKSPACE TESTS ===' >> "$LOG"; cargo test >> "$LOG" 2>&1; STATUS=$?; fi
          if [ $STATUS -eq 0 ]; then echo '=== CLIPPY ===' >> "$LOG"; cargo clippy --workspace --all-targets -- -D warnings >> "$LOG" 2>&1; STATUS=$?; fi
          echo "=== EXIT $STATUS ===" >> "$LOG"
          git reset --hard HEAD
          cp "$LOG" compat_batch_45_failure_v2.log
          git config user.name "Dream64 Compatibility Bot"
          git config user.email "actions@users.noreply.github.com"
          git add compat_batch_45_failure_v2.log
          git commit -m "Capture second compatibility batch verification"
          git push origin HEAD:compat-batch-45
      - name: Remove debug trigger from main
        if: always()
        run: |
          git fetch origin main
          git switch --force-create cleanup origin/main
          git rm -f .github/workflows/debug-compat-batch-45-v2.yml
          git config user.name "Dream64 Compatibility Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Remove second compatibility debug trigger"
          git push origin HEAD:main
