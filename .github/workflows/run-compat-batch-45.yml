name: Run isolated compatibility batch 45

on:
  push:
    branches: [main]
    paths: [.github/workflows/run-compat-batch-45.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compat-batch-45
          fetch-depth: 0
      - name: Apply batch
        run: python3 tools/compat_batch_45.py
      - name: Format
        run: cargo fmt --all
      - name: Focused tests
        run: cargo test -p dm-project -p dm-semantics -p dm-runtime
      - name: Workspace tests
        run: cargo test
      - name: Strict clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Commit verified branch
        run: |
          rm -f .github/workflows/compat-batch-45.yml tools/compat_batch_45.py
          git config user.name "Dream64 Compatibility Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Batch Monkestation compatibility primitives"
          git push origin HEAD:compat-batch-45
      - name: Remove one-shot trigger from main
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git switch --force-create cleanup origin/main
          git rm -f .github/workflows/run-compat-batch-45.yml
          git config user.name "Dream64 Compatibility Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Remove compatibility batch trigger"
          git push origin HEAD:main
