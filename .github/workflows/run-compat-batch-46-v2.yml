name: Retry compatibility batch 46

on:
  push:
    branches: [main]
    paths: [.github/workflows/run-compat-batch-46-v2.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compat-batch-46
          fetch-depth: 0

      - name: Fix fixture and verify batch
        shell: bash
        run: |
          set +e
          rm -f compat_batch_46_v2.log
          : > compat_batch_46_v2.log
          python3 tools/compat_batch_46_followup.py >> compat_batch_46_v2.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then cargo fmt --all >> compat_batch_46_v2.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then cargo test -p dm-project -p dm-vm >> compat_batch_46_v2.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then cargo test >> compat_batch_46_v2.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then cargo clippy --workspace --all-targets -- -D warnings >> compat_batch_46_v2.log 2>&1; status=$?; fi

          git config user.name "Dream64 Compatibility Bot"
          git config user.email "actions@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            git add -A
            git commit -m "Capture compatibility batch 46 retry failure"
            git push origin HEAD:compat-batch-46
            cat compat_batch_46_v2.log
            exit "$status"
          fi

          rm -f tools/compat_batch_46.py tools/compat_batch_46_followup.py compat_batch_46.log compat_batch_46_v2.log
          git add -A
          git commit -m "Batch next Monkestation compatibility layer"
          git push origin HEAD:compat-batch-46

      - name: Remove trigger from main
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git switch --force-create cleanup origin/main
          git rm -f .github/workflows/run-compat-batch-46-v2.yml
          git config user.name "Dream64 Compatibility Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Remove compatibility batch 46 retry verifier"
          git push origin HEAD:main
