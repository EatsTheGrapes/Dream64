name: Run documented core semantics compatibility batch 52

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  verify:
    if: github.event.issue.title == 'Run compatibility core 52'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compat-core-52
          fetch-depth: 0
      - name: Apply and verify documented core semantics
        shell: bash
        run: |
          set +e
          set -o pipefail
          (
            set -e
            python3 tools/compat_core_52.py
            cargo fmt --all
            cargo test -p dm-lexer -p dm-vm
            cargo test
            cargo clippy --workspace --all-targets -- -D warnings
          ) 2>&1 | tee compat_core_52.log
          status=${PIPESTATUS[0]}
          git config user.name "Dream64 Compatibility Bot"
          git config user.email "actions@users.noreply.github.com"
          if [ "$status" -ne 0 ]; then
            git add -A
            git commit -m "Capture compatibility core 52 failure" || true
            git push origin HEAD:compat-core-52
            exit "$status"
          fi
          rm -f tools/compat_core_52.py compat_core_52.log
          git add -A
          git commit -m "Documented core semantics compatibility batch 52"
          git push origin HEAD:compat-core-52
      - name: Remove trigger from main
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git switch --force-create cleanup origin/main
          git rm -f .github/workflows/run-compat-core-52.yml
          git config user.name "Dream64 Compatibility Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Remove compatibility core 52 verifier"
          git push origin HEAD:main
