name: Retry BYOND null-conditional compatibility batch 51

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  verify:
    if: github.event.issue.title == 'Retry compatibility safeaccess 51'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compat-safeaccess-51
          fetch-depth: 0
      - name: Fix regression and verify null-conditional semantics
        shell: bash
        run: |
          set +e
          set -o pipefail
          (
            set -e
            python3 tools/compat_safeaccess_51_followup.py
            cargo fmt --all
            cargo test -p dm-lexer -p dm-vm
            cargo test
            cargo clippy --workspace --all-targets -- -D warnings
          ) 2>&1 | tee compat_safeaccess_51_v2.log
          status=${PIPESTATUS[0]}
          git config user.name "Dream64 Compatibility Bot"
          git config user.email "actions@users.noreply.github.com"
          if [ "$status" -ne 0 ]; then
            git add -A
            git commit -m "Capture compatibility safeaccess 51 retry failure" || true
            git push origin HEAD:compat-safeaccess-51
            exit "$status"
          fi
          rm -f tools/compat_safeaccess_51.py tools/compat_safeaccess_51_followup.py compat_safeaccess_51.log compat_safeaccess_51_v2.log
          git add -A
          git commit -m "BYOND null-conditional compatibility batch 51"
          git push origin HEAD:compat-safeaccess-51
      - name: Remove trigger from main
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git switch --force-create cleanup origin/main
          git rm -f .github/workflows/run-compat-safeaccess-51-v2.yml
          git config user.name "Dream64 Compatibility Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Remove compatibility safeaccess 51 retry verifier"
          git push origin HEAD:main
