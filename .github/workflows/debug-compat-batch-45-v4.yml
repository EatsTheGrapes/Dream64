name: Capture remaining compatibility clippy failure

on:
  push:
    branches: [main]
    paths: [.github/workflows/debug-compat-batch-45-v4.yml]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compat-batch-45
          fetch-depth: 0
      - name: Run and capture clippy
        shell: bash
        run: |
          set +e
          LOG=/tmp/compat45v4.log
          python3 tools/compat_batch_45.py > "$LOG" 2>&1; STATUS=$?
          if [ $STATUS -eq 0 ]; then python3 tools/compat_batch_45_followup.py >> "$LOG" 2>&1; STATUS=$?; fi
          if [ $STATUS -eq 0 ]; then cargo fmt --all >> "$LOG" 2>&1; STATUS=$?; fi
          if [ $STATUS -eq 0 ]; then cargo clippy --workspace --all-targets -- -D warnings >> "$LOG" 2>&1; STATUS=$?; fi
          echo "=== EXIT $STATUS ===" >> "$LOG"
          git reset --hard HEAD
          cp "$LOG" compat_batch_45_failure_v4.log
          git config user.name "Dream64 Compatibility Bot"
          git config user.email "actions@users.noreply.github.com"
          git add compat_batch_45_failure_v4.log
          git commit -m "Capture remaining compatibility clippy failure"
          git push origin HEAD:compat-batch-45
      - name: Remove debug trigger from main
        if: always()
        run: |
          git fetch origin main
          git switch --force-create cleanup origin/main
          git rm -f .github/workflows/debug-compat-batch-45-v4.yml
          git config user.name "Dream64 Compatibility Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Remove remaining compatibility debug trigger"
          git push origin HEAD:main
