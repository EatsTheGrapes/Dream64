name: Run final compatibility inventory 48 workspace gate

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  verify:
    if: github.event.issue.title == 'Run final compatibility inventory 48 workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compat-inventory-48
          fetch-depth: 0
      - name: Apply final lifecycle assertion and verify all
        shell: bash
        run: |
          set +e
          set -o pipefail
          (
            set -e
            python3 tools/compat_inventory_48_followup7.py
            cargo fmt --all
            cargo test -p dm-vm -p dm-runtime -p dm-semantics -p dm-lifecycle
            cargo test
            cargo clippy --workspace --all-targets -- -D warnings
          ) 2>&1 | tee compat_inventory_48_v8.log
          status=${PIPESTATUS[0]}
          git config user.name "Dream64 Compatibility Bot"
          git config user.email "actions@users.noreply.github.com"
          if [ "$status" -ne 0 ]; then
            git add -A
            git commit -m "Capture compatibility inventory 48 workspace failure" || true
            git push origin HEAD:compat-inventory-48
            exit "$status"
          fi
          rm -f tools/compat_inventory_48.py tools/compat_inventory_48_followup.py tools/compat_inventory_48_followup2.py tools/compat_inventory_48_followup3.py tools/compat_inventory_48_followup4.py tools/compat_inventory_48_followup5.py tools/compat_inventory_48_followup6.py tools/compat_inventory_48_followup7.py
          rm -f compat_inventory_48.log compat_inventory_48_v2.log compat_inventory_48_v3.log compat_inventory_48_v4.log compat_inventory_48_v5.log compat_inventory_48_v6.log compat_inventory_48_v7.log compat_inventory_48_v8.log
          git add -A
          git commit -m "Proactive BYOND semantic compatibility batch 48"
          git push origin HEAD:compat-inventory-48
      - name: Remove trigger from main
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git switch --force-create cleanup origin/main
          git rm -f .github/workflows/run-compat-inventory-48-v8.yml
          git config user.name "Dream64 Compatibility Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Remove compatibility inventory 48 workspace verifier"
          git push origin HEAD:main
