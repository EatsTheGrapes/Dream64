name: Run compatibility batch 46 lint gate

on:
  push:
    branches: [main]
    paths: [.github/workflows/run-compat-batch-46-lint.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compat-batch-46
          fetch-depth: 0
      - name: Apply lint cleanup and verify
        shell: bash
        run: |
          set -e
          python3 tools/compat_batch_46_lint.py
          cargo fmt --all
          cargo test -p dm-project -p dm-vm
          cargo clippy --workspace --all-targets -- -D warnings
          rm -f tools/compat_batch_46_lint.py tools/compat_batch_46.py tools/compat_batch_46_followup.py
          rm -f compat_batch_46.log compat_batch_46_v2.log compat_batch_46_v3.log compat_batch_46_v4.log
          git config user.name "Dream64 Compatibility Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finish Monkestation compatibility batch 46"
          git push origin HEAD:compat-batch-46
      - name: Remove trigger from main
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git switch --force-create cleanup origin/main
          git rm -f .github/workflows/run-compat-batch-46-lint.yml
          git config user.name "Dream64 Compatibility Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Remove compatibility batch 46 lint gate"
          git push origin HEAD:main
