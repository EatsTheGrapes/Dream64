name: Finish compatibility batch 45 verification

on:
  push:
    branches: [main]
    paths: [.github/workflows/run-compat-batch-45-v6.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compat-batch-45
          fetch-depth: 0
      - name: Apply and verify
        shell: bash
        run: |
          set -e
          python3 tools/compat_batch_45.py
          python3 tools/compat_batch_45_followup.py
          cargo fmt --all
          cargo test -p dm-project -p dm-semantics -p dm-runtime
          cargo clippy --workspace --all-targets -- -D warnings
          rm -f .github/workflows/compat-batch-45.yml tools/compat_batch_45.py tools/compat_batch_45_followup.py compat_batch_45_failure.log compat_batch_45_failure_v2.log compat_batch_45_failure_v3.log compat_batch_45_failure_v4.log compat_batch_45_failure_v5.log
          git config user.name "Dream64 Compatibility Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Batch Monkestation compatibility primitives"
          git push origin HEAD:compat-batch-45
      - name: Remove trigger from main
        if: always()
        run: |
          git fetch origin main
          git switch --force-create cleanup origin/main
          git rm -f .github/workflows/run-compat-batch-45-v6.yml
          git config user.name "Dream64 Compatibility Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Remove compatibility batch verifier"
          git push origin HEAD:main
