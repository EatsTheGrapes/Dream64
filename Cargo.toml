[workspace]
members = [
	"crates/dm-client",
	"crates/dm-conformance",
	"crates/dm-compiler",
	"crates/dm-core",
	"crates/dm-dmf",
	"crates/dm-globals",
	"crates/dm-jit",
	"crates/dm-lexer",
	"crates/dm-lifecycle",
	"crates/dm-lowering",
	"crates/dm-map",
	"crates/dm-mmap",
	"crates/dm-object-tree",
	"crates/dm-project",
	"crates/dm-runtime",
	"crates/dm-semantics",
	"crates/dm-syntax",
	"crates/dm-value",
	"crates/dm-vm",
	"crates/dm-world",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# Runtime releases spend most of their time crossing crate boundaries between
# bytecode dispatch, value storage, and host builtins. Give LLVM one optimized
# whole-program view while retaining ThinLTO's practical release build time.
[profile.release]
lto = "thin"
codegen-units = 1
